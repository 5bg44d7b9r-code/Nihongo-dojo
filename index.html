<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nihongo Dojo">
<meta name="theme-color" content="#F6F1E7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Nihongo Dojo</title>
<style>
:root{--bg:#F6F1E7;--card:#FFFDF8;--ink:#1F2433;--muted:#6B6F7B;--line:#E6DDCB;--ai:#2B3A67;--shu:#D9442B;--gold:#E0A526;--good:#2F8F5B;--bad:#C93A2B;--r:18px;
--l1:#F6D9CB;--l2:#F5E3B3;--l3:#D3DAF2;--l4:#CDE8D6}
@media (prefers-color-scheme:dark){:root{--bg:#14161D;--card:#1E212B;--ink:#F1ECE2;--muted:#9AA0AE;--line:#2F3340;--ai:#93A6EA;--l1:#5A3227;--l2:#56472A;--l3:#2F3A61;--l4:#24503A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif}
.muted{color:var(--muted)}.small{font-size:13px}.right{margin-left:auto}
.view{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px);max-width:560px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;font-size:11px;color:var(--muted)}
.tabbar .ti{font-size:22px;line-height:1.1}.tabbar .on{color:var(--shu)}
h1.title{font-size:28px;margin:6px 0 12px}
h2.sec{font-size:19px;margin:24px 0 10px}
h3.sub{font-size:14px;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.row{display:flex;align-items:center;gap:8px}
.hero{display:flex;align-items:center;gap:12px;margin-top:4px}
.daruma{width:84px;height:84px;flex:none}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;flex:1}
.bubble:before{content:"";position:absolute;left:-7px;top:28px;width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble .big{font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.sv{font-size:20px;font-weight:700}.sl{font-size:12px;color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--shu));border-radius:6px;transition:width .4s}
.cta{display:flex;flex-direction:column;align-items:center;width:100%;background:var(--shu);color:#fff;border-radius:20px;padding:18px;margin-top:6px;box-shadow:0 6px 0 #A8321F;transition:transform .08s}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #A8321F}
.cta-t{font-size:21px;font-weight:700}.cta-s{font-size:13px;opacity:.9;margin-top:2px}
.track{margin-bottom:6px}
.track-h{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px}
.track-h b{font-size:17px}.track-h .jp{color:var(--muted)}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.unit.locked{opacity:.5}
.ring{width:46px;height:46px;border-radius:50%;flex:none;background:conic-gradient(var(--shu) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:700}
.ring.done{background:var(--good)}.ring.done span{color:var(--good)}
.un{font-weight:600}.up{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ut{min-width:0}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:17px}
.seg .on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.grid.g3{grid-template-columns:repeat(3,1fr)}
.kc{border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;background:var(--card);border:1px solid var(--line)}
.kc .jp{font-size:26px;line-height:1.15}.kc small{font-size:11px;color:var(--muted)}
.l-n{opacity:.45}.l-1{background:var(--l1)}.l-2{background:var(--l2)}.l-3{background:var(--l3)}.l-4{background:var(--l4)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:16px}
.legend span{display:flex;align-items:center;gap:4px}.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.wrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:6px}
.wk{font-size:22px;min-width:76px}.wr{flex:1;display:flex;flex-direction:column}.wr small{color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.lockline{font-size:13px;color:var(--muted);margin:-2px 0 8px}
/* Session */
.sess{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 16px);max-width:560px;margin:0 auto}
.stop{display:flex;align-items:center;gap:10px}
.icon{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:16px}
.timer{flex:1;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.combo{min-width:38px;text-align:right;font-weight:700;color:var(--gold)}.combo.hot{color:var(--shu)}
.tbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 6px}
.tbar i{display:block;height:100%;background:var(--ai);transition:width .25s linear}
.timeup{background:var(--l2);border-radius:12px;padding:8px 12px;font-size:14px;margin:6px 0}
.stage{flex:1;display:flex;flex-direction:column;padding-top:10px}
.tag{align-self:flex-start;background:var(--ai);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.q{font-size:15px;color:var(--muted);margin:10px 0 4px}
.prompt{text-align:center;margin:8px 0 18px}
.big-char{font-size:110px;line-height:1.1;text-align:center}
.big-word{font-size:52px;line-height:1.2;text-align:center}
.kanji{font-size:22px;color:var(--muted);text-align:center}
.roma{font-size:24px;text-align:center;color:var(--muted);letter-spacing:.04em}
.de-big{font-size:30px;font-weight:700;text-align:center}
.sound{display:block;margin:6px auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:16px}
.sound.huge{font-size:52px;width:130px;height:130px;border-radius:50%;padding:0;margin:20px auto}
.mn{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 14px;margin:14px 0}
.mn p{margin:4px 0 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 8px;font-size:20px;font-weight:600;min-height:68px;box-shadow:0 3px 0 var(--line)}
.opt.jp{font-size:34px;font-weight:400}
.opt.de{font-size:16px}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.ok{border-color:var(--good);background:var(--l4)}.opt.bad{border-color:var(--bad);background:var(--l1)}
.opt.dim{opacity:.45}
.primary{display:block;width:100%;background:var(--ai);color:#fff;border-radius:16px;padding:16px;font-size:18px;font-weight:700;margin-top:auto}
.primary.shu{background:var(--shu)}
.ghost{display:block;width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px;font-size:16px;margin-top:8px}
.danger{color:var(--bad)}
.fb{border-radius:16px;padding:12px 14px;margin-top:12px}
.fb.ok{background:var(--l4);font-weight:700;text-align:center}
.fb.bad{background:var(--l1)}
.fb .primary{margin-top:10px}
input.typein{width:100%;font-size:26px;text-align:center;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
input.typein:focus{border-color:var(--ai)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:62px;padding:8px;border-bottom:2px dashed var(--line);margin-bottom:14px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:12px}
.tile{font-size:30px;width:56px;height:56px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.sum{text-align:center;padding-top:20px}
.sum .daruma{margin:0 auto;width:110px;height:110px}
.sum h2{font-size:28px;margin:8px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:18px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
/* Modal */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mb{position:absolute;inset:0;background:rgba(0,0,0,.35);animation:fade .2s}
.mc{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .25s ease-out}
.mc h3{margin:4px 0 8px;font-size:20px}
.mc textarea{width:100%;height:110px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px;font-size:12px;-webkit-user-select:text;user-select:text}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:10px 0}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;animation:up .25s}
.set{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;gap:10px}
.set:last-child{border-bottom:0}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:var(--good)}.sw.on:after{left:21px}
.pills{display:flex;gap:6px}.pills button{border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card)}
.pills .on{background:var(--ai);color:#fff;border-color:var(--ai)}
.road li{margin:6px 0}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.08)}}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.buddy{position:fixed;right:0;top:38%;display:flex;align-items:flex-start;gap:2px;pointer-events:none;z-index:15;transform:translateX(115%);transition:transform .4s cubic-bezier(.3,1.35,.5,1)}
.buddy.show{transform:translateX(0)}
.buddy .bav{width:92px;height:108px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.buddy .bb{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:6px 10px;margin-top:18px;box-shadow:0 4px 12px rgba(0,0,0,.12);text-align:center}
.buddy .bb b{display:block;font-size:17px;white-space:nowrap}.buddy .bb small{color:var(--muted);font-size:11px;white-space:nowrap}
.pad{position:relative;width:100%;max-width:320px;margin:0 auto 10px;aspect-ratio:1;background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.pad canvas{width:100%;height:100%;touch-action:none;display:block}
.emo{font-size:96px;text-align:center;line-height:1.15}
.opt.emo-opt{font-size:44px;font-weight:400}
.mnrow{display:flex;gap:12px;align-items:center}.mnrow p{margin:0}.mnemo{font-size:42px;line-height:1}
.mute{margin-top:12px;font-size:14px}
.buddy img.bav{width:110px;height:130px;object-fit:contain}
.buddy img.bav.round{width:100px;height:100px;object-fit:cover;border-radius:50%;border:3px solid var(--card);margin-top:6px}
.avprev{display:block;margin:10px auto;max-width:150px;max-height:170px;object-fit:contain}.avprev.round{width:130px;height:130px;object-fit:cover;border-radius:50%}
label.ghost{text-align:center;cursor:pointer}
.buddy video.bav{width:120px;height:140px;object-fit:contain;border-radius:14px}
.buddy video.bav.round{width:104px;height:104px;object-fit:cover;border-radius:50%;border:3px solid var(--card)}
.avw{position:relative}
.a-bounce .bav{animation:abounce .9s cubic-bezier(.3,1.5,.5,1)}
.a-wiggle .bav{animation:awiggle .5s ease-in-out 4}
.a-float .bav{animation:afloat 1.4s ease-in-out infinite}
.a-pulse .bav{animation:apulse .7s ease-in-out infinite}
.a-spin .bav{animation:aspin .9s ease-out}
@keyframes abounce{0%{transform:scale(.3) rotate(-15deg)}55%{transform:scale(1.15) rotate(6deg)}75%{transform:scale(.95) rotate(-2deg)}100%{transform:scale(1)}}
@keyframes awiggle{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes afloat{50%{transform:translateY(-10px)}}
@keyframes apulse{50%{transform:scale(1.1)}}
@keyframes aspin{from{transform:perspective(300px) rotateY(0) scale(.6)}to{transform:perspective(300px) rotateY(360deg) scale(1)}}
.spark{position:absolute;left:50%;top:45%;pointer-events:none}
.spark i{position:absolute;font-style:normal;font-size:20px;opacity:0;animation:spark 1.3s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.avtile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.avtile img,.avtile video{width:100%;height:100%;object-fit:cover;display:block}
.avtile button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px}
.avtile span{position:absolute;left:4px;bottom:2px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   Nihongo Dojo – Version 1.0
   Japanisch lernen bis N5: Kana + Grundwortschatz
   Methoden: Spaced Repetition (Leitner-System), aktives Abrufen,
   Eselsbrücken, Hören, gemischtes Üben, 25-Minuten-Sessions
   ========================================================= */

// ---------- Eselsbrücken ----------
const MN = {
'あ':'Ein Kreuz mit großer Schleife: Jemand verheddert sich im Seil und ruft „Aaah!“',
'い':'Zwei Striche nebeneinander – sieht aus wie ein kleines „ii“.',
'う':'Ein liegendes U mit einem Strich darüber – wie ein Ohr, das fragt: „Uh?“',
'え':'Eine kleine Figur mit Krönchen tanzt los – „Eh, schau mal!“',
'お':'Ein Golfer holt aus, der Ball (kleiner Strich rechts) fliegt davon: „Oh!“',
'か':'Ein Karate-Kämpfer mit erhobenem Arm, der Strich rechts ist sein Kampfschrei: „Ka!“',
'き':'Sieht aus wie ein Schlüssel – auf Englisch „key“ = ki.',
'く':'Ein offener Schnabel: Der Kuckuck ruft „ku-ku“.',
'け':'Ein k mit extra Strich – k(e) wie in Kegel.',
'こ':'Zwei Kordeln übereinander – Ko-rdel.',
'さ':'Ein Säbel: oben gekreuzt, unten der Griffbogen – Sa-bel. (Achtung: ち ist gespiegelt!)',
'し':'Ein Angelhaken – daran hängt ein Schi-ff.',
'す':'Ein Seil mit Knoten an einem Balken – eine Schaukel: Su-perschwung!',
'せ':'Ein Mund mit einem langen Vampirzahn – „Se-hr hungrig!“',
'そ':'Eine Zickzack-Linie wie So-ße, die aus der Flasche spritzt.',
'た':'Links ein kleines t, rechts ein a-ähnliches こ: t + a = ta.',
'ち':'Ein Mann mit dickem Bauch nach zu vielen Tschi-ps. (Gespiegeltes さ!)',
'つ':'Eine große Welle – Tsu-nami!',
'て':'Ein T, das sich verbogen hat: te.',
'と':'Ein Zahnstocher steckt im To-fu.',
'な':'Kreuz, Strich und Schlaufe – eine Na-del mit Faden und Knoten.',
'に':'Links ein Mensch, der kniet (Knie → ni), rechts zwei Stufen.',
'ぬ':'Nu-deln um die Gabel gewickelt – mit Schleife unten. (め hat keine Schleife!)',
'ね':'Eine Katze (jap. neko) mit eingerolltem Schwanz – ne.',
'の':'Ein Verbotsschild: Kreis mit Strich – „No!“',
'は':'Links ein Strich, rechts eine lachende Figur: „Ha-ha!“',
'ひ':'Ein breites Grinsen: „Hi-hi-hi!“',
'ふ':'Der Berg Fu-ji mit Wölkchen links und rechts.',
'へ':'Ein kleiner Hügel – „He, da oben!“ (In Katakana fast gleich: ヘ)',
'ほ':'Wie は, aber mit Mütze – der Weihnachtsmann ruft „Ho-ho-ho!“',
'ま':'Ma-ma mit ausgebreiteten Armen und Schleife am Kleid.',
'み':'Sieht aus wie eine 21 – „Mi-tte zwanzig“.',
'む':'Eine Kuh mit Schwanz und Ohr: „Muh!“',
'め':'Ein Auge mit Wimper – Auge heißt auf Japanisch 目 (me)! (ぬ hat eine Schleife.)',
'も':'Ein Angelhaken mit zwei Ködern – noch mo-re (mehr) Fische!',
'や':'Ein Ya-k mit Hörnern.',
'ゆ':'Ein Fisch von vorne, der fröhlich „Yu-hu!“ ruft.',
'よ':'Ein Yo-Yo an der Schnur.',
'ら':'Eine Ra-kete mit Abgasschweif, die gerade zündet.',
'り':'Zwei Schilfrohre im Wind – ri wie Ried.',
'る':'Wie ろ, aber mit Looping unten – eine Ru-tschbahn.',
'れ':'Ein Mensch rennt nach rechts – re-nnen. (Nicht verwechseln: ね, わ)',
'ろ':'Eine Straße (engl. road) mit Kurve – ohne Schleife.',
'わ':'Ein Wa-l mit Schwanzflosse.',
'を':'Jemand klettert über eine Mauer: „Wo-ah!“ – wird meist wie o gesprochen, fast nur als Partikel.',
'ん':'Sieht aus wie ein kleines n in Schreibschrift.',
'ア':'Eine Axt – A-xt.',
'イ':'Ein Mensch, der sich anlehnt – wie ein schiefes I.',
'ウ':'Wie う, aber mit Mützchen oben drauf.',
'エ':'Ein Stahlträger aus E-isen.',
'オ':'Ein O-pa mit Gehstock.',
'カ':'Wie か – nur ohne den Strich rechts.',
'キ':'Wie き ohne Unterteil – immer noch ein Schlüssel (key).',
'ク':'Der Kuckuck mit kantigem Schnabel.',
'ケ':'Ein schiefes K – ke. (Vorsicht: ク, タ)',
'コ':'Eine eckige Klammer – die Ko-mmoden-Schublade.',
'サ':'Ein Sa-ttel mit zwei Beinen darunter.',
'シ':'Ein Gesicht, das zur Seite lächelt: Die Striche kommen von links. (ツ: von oben!)',
'ス':'Ein Su-perheld, der mit Umhang davonrennt.',
'セ':'Wie せ, nur eckiger.',
'ソ':'So-ße tropft von oben herunter. (ン: der lange Strich geht nach oben.)',
'タ':'Wie ク mit einem Strich innen – eine Ta-sche mit Fach.',
'チ':'Ein Häuptling (engl. chief) mit Federschmuck – chi.',
'ツ':'Zwei Tropfen fallen von oben – Tsu-nami von oben! (シ: von links)',
'テ':'Ein Te-lefonmast.',
'ト':'Ein Torpfosten mit Klinke – To-r.',
'ナ':'Ein Kreuz – eine Na-del, Öhr nach unten.',

function tone(f,t0,d,type='sine',g=0.07){const t=AC.currentTime+t0,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(g,t+0.01);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+0.05);}

function idb(){return new Promise((res,rej)=>{if(DBH)return res(DBH);try{const r=indexedDB.open('nihongoDojoMedia',1);r.onupgradeneeded=()=>r.result.createObjectStore('av',{keyPath:'id'});r.onsuccess=()=>{DBH=r.result;res(DBH);};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
async function idbReq(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('av',mode),st=tx.objectStore('av'),rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);});}
async function loadAvs(){try{const all=await idbReq('readonly',st=>st.getAll());AVS.forEach(a=>URL.revokeObjectURL(a.url));AVS=(all||[]).sort((a,b)=>a.added-b.added).map(o=>({id:o.id,type:o.type,url:URL.createObjectURL(o.blob),mem:false}));}catch(e){}}
function dataURLtoBlob(d){const [h,b]=d.split(','),m=h.match(/:(.*?);/)[1],s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m});}
async function addAv(blob,type){const o={id:'a'+Date.now()+Math.random().toString(36).slice(2,6),type,blob,added:Date.now()};
  try{await idbReq('readwrite',st=>st.put(o));await loadAvs();}catch(e){AVS.push({id:o.id,type,url:URL.createObjectURL(blob),mem:true});}}

(async()=>{try{const old=localStorage.getItem(AVKEY);if(old){await addAv(dataURLtoBlob(old),'image');localStorage.removeItem(AVKEY);}}catch(e){}await loadAvs();})();

const remain=()=>Math.max(0,SESS.total-SESS.elapsed);

},250);

function nextNew(){
  const pick=tr=>{for(const u of UNITS){if(!tr.includes(u.track)||!isUnlocked(u))continue;const id=u.items.find(i=>!S.items[i]);if(id)return id;}return null;};
  const k=pick(['hira','kata']),v=pick(['vocab']);
  if(k&&v)return SESS.newCount%3===2?v:k;return k||v;
}
function practicePick(){
  const ids=Object.keys(S.items).filter(i=>ITEMS[i]&&i!==SESS.lastId);if(!ids.length)return null;
  const w=ids.map(i=>8-S.items[i].box),sum=w.reduce((a,b)=>a+b,0);let r=Math.random()*sum;
  for(let j=0;j<ids.length;j++){r-=w[j];if(r<=0)return ids[j];}return ids[0];
}
function nextEx(){
  if(SESS.timeUp)return finishSession(true);
  SESS.pending.forEach(p=>p.wait--);
  let id=null,mode='quiz';
  const pi=SESS.pending.findIndex(p=>p.wait<=0&&p.id!==SESS.lastId);
  if(pi>=0){id=SESS.pending[pi].id;SESS.pending.splice(pi,1);}
  if(!id){const d=dueList().filter(x=>x!==SESS.lastId&&!SESS.pending.some(p=>p.id===x));if(d.length)id=d[0];}
  if(!id&&SESS.newCount<S.settings.newPer){const n=nextNew();if(n){id=n;mode='learn';}}
  if(!id&&SESS.pending.length){const j=SESS.pending.findIndex(p=>p.id!==SESS.lastId);if(j>=0){id=SESS.pending[j].id;SESS.pending.splice(j,1);}}
  if(!id)id=practicePick();
  if(!id){const n=nextNew();if(n){id=n;mode='learn';}}
  if(!id)return finishSession(false);
  SESS.lastId=id;if(SESS.hist[SESS.hist.length-1]!==id)SESS.hist.push(id);
  if(mode==='learn'){
    S.items[id]={box:0,due:0,right:0,wrong:0};SESS.newCount++;SESS.learned.push(id);SESS.pending.push({id,wait:2});
    S.xp+=5;SESS.xp+=5;save();SESS.ex={mode:'learn',id};
  }else SESS.ex=makeEx(id);
  renderSession();
  const it=ITEMS[id];
  if(S.settings.autoplay&&(mode==='learn'))setTimeout(()=>speak(sayText(it)),250);
  if(audioOK()&&(SESS.ex.t==='a2k'||SESS.ex.t==='a2de'))setTimeout(()=>speak(sayText(it)),300);
}
function makeEx(id){
  const it=ITEMS[id],b=Math.max(0,box(id)),v=audioOK();let ts;
  if(it.type==='kana'){ts=b<1?['k2r','r2k','trace']:b<3?['k2r','r2k','trace','write']:['k2r','r2k','write','type'];if(it.char.length>1)ts=ts.filter(x=>x!=='trace'&&x!=='write');if(v&&b>=1)ts.push('a2k');}
  else{ts=b<2?['jp2de','jp2de']:['de2jp','build','build','jp2de'];if(it.emo)ts.push(b<2?'jp2pic':'pic2jp','pic2jp');if(v)ts.push('a2de');}
  const t=rand(ts),ex={mode:'quiz',id,t};
  if(t==='build'){ex.tiles=buildTiles(it);ex.picked=[];}
  else if(t==='trace'||t==='write')ex.strokes=[];
  else if(t!=='type')ex.opts=it.type==='kana'?kanaOpts(it):vocabOpts(it,t==='jp2pic');
  return ex;
}
function kanaOpts(it){
  const same=Object.values(ITEMS).filter(x=>x.type==='kana'&&x.script===it.script&&x.id!==it.id&&(x.char.length===it.char.length));
  const used=new Set([it.romaji]),out=[];
  const add=x=>{if(x&&out.length<3&&!used.has(x.romaji)){used.add(x.romaji);out.push(x.id);}};
  shuffle(CONFMAP[it.char]||[]).forEach(c=>add(ITEMS['k:'+c]));
  shuffle(same.filter(x=>x.unit===it.unit)).forEach(add);
  shuffle(same.filter(x=>S.items[x.id])).forEach(add);
  shuffle(same).forEach(add);
  return shuffle([it.id,...out]);
}
function vocabOpts(it,pic){
  const all=Object.values(ITEMS).filter(x=>x.type==='vocab'&&x.id!==it.id&&(!pic||x.emo)),used=new Set([it.de,it.emo]),out=[];
  const add=x=>{if(out.length<3&&!used.has(x.de)&&!(pic&&used.has(x.emo))){used.add(x.de);if(pic)used.add(x.emo);out.push(x.id);}};
  shuffle(all.filter(x=>x.unit===it.unit)).slice(0,2).forEach(add);shuffle(all).forEach(add);
  return shuffle([it.id,...out]);
}
function buildTiles(it){
  const ch=[...it.kana],kata=/[゠-ヿ]/.test(it.kana);
  const pool=Object.values(ITEMS).filter(x=>x.type==='kana'&&x.char.length===1&&x.script===(kata?'kata':'hira')&&!ch.includes(x.char)).map(x=>x.char);
  const extra=shuffle(pool).slice(0,Math.min(4,Math.max(2,6-ch.length)));
  return shuffle([...ch,...extra]);
}

function shrinkImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const M=480,s=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>{if(b&&b.size<1200000)res(b);else c.toBlob(b2=>b2?res(b2):rej(),'image/jpeg',0.85);},'image/png');};
  img.onerror=()=>{URL.revokeObjectURL(url);rej();};img.src=url;});}

  if(e.target.id!=='avfile'||!e.target.files.length)return;

const GF='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif';
function drawGlyph(ctx,ch,W,color,lw){const fs=ch.length>1?W*0.46:W*0.78;ctx.save();ctx.font=`400 ${fs}px ${GF}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;const y=W/2+fs*0.04;ctx.fillText(ch,W/2,y);if(lw){ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.strokeText(ch,W/2,y);}ctx.restore();}
function setupPad(ex){
  const c=$('#pad');if(!c)return;const it=ITEMS[ex.id],dpr=window.devicePixelRatio||1,W=c.getBoundingClientRect().width;
  c.width=W*dpr;c.height=W*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--ink').trim()||'#1F2433',line=cs.getPropertyValue('--line').trim()||'#E6DDCB';
  const draw=()=>{ctx.clearRect(0,0,W,W);ctx.save();ctx.strokeStyle=line;ctx.lineWidth=1.5;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,W);ctx.moveTo(0,W/2);ctx.lineTo(W,W/2);ctx.stroke();ctx.restore();
    if(ex.result)drawGlyph(ctx,it.char,W,ex.result.ok?'rgba(47,143,91,.32)':'rgba(201,58,43,.28)',0);
    else if(ex.t==='trace')drawGlyph(ctx,it.char,W,'rgba(120,120,140,.22)',0);
    ctx.strokeStyle=ink;ctx.lineWidth=W*0.05;ctx.lineCap='round';ctx.lineJoin='round';
    for(const s of ex.strokes){ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p.x*W,p.y*W):ctx.moveTo(p.x*W,p.y*W));if(s.length===1)ctx.lineTo(s[0].x*W+0.1,s[0].y*W);ctx.stroke();}};
  draw();if(ex.result)return;
  let cur=null;const pos=e=>{const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height};};
  c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId);}catch(_){}cur=[pos(e)];ex.strokes.push(cur);draw();};
  c.onpointermove=e=>{if(!cur)return;e.preventDefault();cur.push(pos(e));draw();};
  c.onpointerup=c.onpointercancel=()=>{cur=null;};
}
function scoreDrawing(ch,strokes){
  const N=100,mk=()=>{const c=document.createElement('canvas');c.width=c.height=N;return c.getContext('2d',{willReadFrequently:true});};
  const g=mk(),gd=mk(),u=mk();drawGlyph(g,ch,N,'#000',0);drawGlyph(gd,ch,N,'#000',6);
  const gD=g.getImageData(0,0,N,N).data,gdD=gd.getImageData(0,0,N,N).data;
  let gx0=N,gy0=N,gx1=0,gy1=0;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(gD[(y*N+x)*4+3]>100){if(x<gx0)gx0=x;if(x>gx1)gx1=x;if(y<gy0)gy0=y;if(y>gy1)gy1=y;}
  const pts=strokes.flat();let ux0=1,uy0=1,ux1=0,uy1=0;for(const p of pts){ux0=Math.min(ux0,p.x);ux1=Math.max(ux1,p.x);uy0=Math.min(uy0,p.y);uy1=Math.max(uy1,p.y);}
  const uw=(ux1-ux0)*N,uh=(uy1-uy0)*N,gw=gx1-gx0,gh=gy1-gy0;let sx=uw>4?gw/uw:0,sy=uh>4?gh/uh:0;if(!sx)sx=sy||1;if(!sy)sy=sx;
  const mx=p=>gx0+(p.x*N-ux0*N)*sx+(uw>4?0:gw/2),my=p=>gy0+(p.y*N-uy0*N)*sy+(uh>4?0:gh/2);
  u.strokeStyle='#000';u.lineWidth=8;u.lineCap='round';u.lineJoin='round';
  for(const s of strokes){u.beginPath();s.forEach((p,i)=>i?u.lineTo(mx(p),my(p)):u.moveTo(mx(p),my(p)));if(s.length===1)u.lineTo(mx(s[0])+0.1,my(s[0]));u.stroke();}
  const uD=u.getImageData(0,0,N,N).data;let core=0,hit=0,ink=0,inside=0;
  const G=5,cg=new Array(G*G).fill(0),cu=new Array(G*G).fill(0);
  for(let i=3;i<uD.length;i+=4){const gc=gD[i]>100,ui=uD[i]>100,px=((i-3)/4)%N,py=Math.floor((i-3)/4/N),cell=Math.min(G-1,Math.floor((py-gy0)/(gh+1)*G))*G+Math.min(G-1,Math.floor((px-gx0)/(gw+1)*G));
    if(gc){core++;if(ui)hit++;if(cell>=0)cg[cell]++;}if(ui){ink++;if(gdD[i]>60)inside++;if(cell>=0&&px>=gx0&&py>=gy0)cu[cell]++;}}
  // Formvergleich: welche Felder des Rasters sind belegt?
  let same=0,tot=0;for(let k=0;k<G*G;k++){const a=cg[k]>4,b=cu[k]>4;if(a||b){tot++;if(a&&b)same++;}}
  const cov=core?hit/core:0,prec=ink?inside/ink:0,ratio=core?ink/core:9,grid=tot?same/tot:0;
  return{cov,prec,ratio,grid,ok:cov>=0.5&&prec>=0.78&&ratio<=2.6&&grid>=0.75};
}
function answer(ok,extra){
  const ex=SESS.ex;if(ex.result)return;
  const id=ex.id,p=S.items[id],now=Date.now(),before=levelInfo().level,wasDue=p.box>=1&&p.due<=now;
  let gain=0;
  if(ok){S.stats.right++;p.right++;SESS.right++;SESS.combo++;SESS.best=Math.max(SESS.best,SESS.combo);gain=10+Math.min(10,(SESS.combo-1)*2);S.xp+=gain;SESS.xp+=gain;
    if(p.box===0){p.box=1;p.due=now+IV[1];}else if(wasDue){p.box=Math.min(7,p.box+1);p.due=now+Math.round(IV[p.box]*(0.9+Math.random()*0.2));}
  }else{S.stats.wrong++;p.wrong++;SESS.wrong++;SESS.combo=0;if(p.box>0){p.box=1;p.due=now+IV[1];}SESS.pending.push({id,wait:3});}
  ex.result=Object.assign({ok,gain},extra||{});
  flushTime();sfx(ok?'ok':'bad');if(ok)buddy(SESS.combo);
  if(levelInfo().level>before){setTimeout(()=>{sfx('lvl');toast('🎉 Level '+levelInfo().level+' – '+levelInfo().title+'!');},300);}
  renderSession();
  if(audioOK()&&ex.t!=='a2k'&&ex.t!=='a2de'&&S.settings.autoplay)speak(sayText(ITEMS[id]));
  if(ok)setTimeout(()=>{if(SESS&&SESS.ex===ex)nextEx();},(ex.t==='trace'||ex.t==='write')?1500:900);
}

  item:b=>openItem(b.dataset.id),
  ktab:b=>{kanaTab=b.dataset.v;render();},
  say:b=>speak(b.dataset.t),
  close:()=>closeModal(),
  next:()=>nextEx(),
  opt:b=>{const ex=SESS.ex,i=+b.dataset.i;answer(ex.opts[i]===ex.id,{given:i});},
  pick:b=>{const ex=SESS.ex,i=+b.dataset.i;if(ex.result||ex.picked.includes(i))return;ex.picked.push(i);const it=ITEMS[ex.id];renderSession();if(ex.picked.length===[...it.kana].length)checkBuild();},
  unpick:b=>{const ex=SESS.ex;if(ex.result)return;ex.picked.splice(+b.dataset.k,1);renderSession();},
  bclear:()=>{SESS.ex.picked=[];renderSession();},
  bcheck:()=>checkBuild(),
  back:()=>showHist(SESS.hist.length-2),
  hist:b=>showHist(+b.dataset.i),
  tclear:()=>{SESS.ex.strokes.length=0;setupPad(SESS.ex);},
  tcheck:()=>{const ex=SESS.ex;if(!ex.strokes.length){toast('Erst zeichnen ✍️');return;}const sc=scoreDrawing(ITEMS[ex.id].char,ex.strokes);answer(sc.ok,{cov:sc.cov,prec:sc.prec});},
  mute:()=>{S.settings.silent=!S.settings.silent;save();try{speechSynthesis.cancel();}catch(e){}toast(S.settings.silent?'🔇 Lautlos-Modus an':'🔊 Ton an');
    if(view==='session'&&SESS&&!SESS.done){const ex=SESS.ex;if(S.settings.silent&&ex.mode==='quiz'&&!ex.result&&(ex.t==='a2k'||ex.t==='a2de'))SESS.ex=makeEx(ex.id);renderSession();}else render();},
  quit:()=>modal(`<h3>Session beenden?</h3><p class="muted">Dein Fortschritt ist gespeichert. Für die Tagesserie zählt nur eine vollständige Session.</p><button class="primary" data-act="close">Weiterlernen</button><button class="ghost danger" data-act="doquit">Beenden</button>`),
  doquit:()=>{closeModal();finishSession(false);},
  home:()=>{SESS=null;view='home';render();window.scrollTo(0,0);},
  daruma:()=>modal(`<div class="daruma" style="margin:0 auto;width:110px;height:110px">${darumaSVG(hiraDone())}</div><h3>Dein Daruma</h3><p>In Japan malt man einem Daruma ein Auge aus, wenn man sich ein Ziel setzt – und das zweite, wenn man es erreicht hat.</p><p><b>Dein Ziel:</b> alle Hiragana festigen. ${hiraDone()?'Geschafft! 🎉':'Dann bekommt er sein zweites Auge.'}</p><button class="ghost" data-act="close">Schließen</button>`),
  set:b=>{const k=b.dataset.k;S.settings[k]=!S.settings[k];save();render();},
  pill:b=>{S.settings[b.dataset.k]=+b.dataset.v;save();render();},
  export:()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));modal(`<h3>Fortschritt sichern</h3><p class="muted small">Kopiere den Code und speichere ihn z. B. in der Notizen-App.</p><textarea id="exp" readonly>${code}</textarea><button class="primary" data-act="copy">Kopieren</button><button class="ghost" data-act="close">Schließen</button>`);},
  copy:()=>{const t=$('#exp');const v=t.value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Kopiert ✓')).catch(()=>{t.focus();t.select();toast('Bitte manuell kopieren');});},
  import:()=>modal(`<h3>Fortschritt wiederherstellen</h3><p class="muted small">Füge deinen gesicherten Code ein. Der aktuelle Stand wird ersetzt.</p><textarea id="imp" placeholder="Code hier einfügen"></textarea><button class="primary" data-act="doimport">Laden</button><button class="ghost" data-act="close">Abbrechen</button>`),
  doimport:()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));if(!o.items)throw 0;localStorage.setItem(KEY,JSON.stringify(o));S=load();closeModal();render();toast('Fortschritt geladen ✓');}catch(e){toast('Code ungültig');}},
  reset:()=>modal(`<h3>Wirklich alles zurücksetzen?</h3><p class="muted">XP, Serie und alle gelernten Zeichen werden gelöscht. Das kann nicht rückgängig gemacht werden.</p><div class="row2"><button class="ghost danger" data-act="doreset">Ja</button><button class="primary" style="margin-top:8px" data-act="close">Nein</button></div>`),
  ver:()=>{const n=Date.now();verTaps=(n-verLast<1500)?verTaps+1:1;verLast=n;if(verTaps>=5){verTaps=0;openAvatar();}},
  avset:b=>{const k=b.dataset.k;S.settings[k]=!S.settings[k];save();openAvatar();},
  avrm:async b=>{await delAv(b.dataset.id);if(!AVS.length){S.settings.avatarOn=false;save();}openAvatar();},
  avpill:b=>{S.settings[b.dataset.k]=b.dataset.v;save();openAvatar();},
  avtest:()=>{closeModal();buddy(5,true);},
  treset:()=>{if(!S.snap||S.snap.date!==dk()){toast('Heute wurde noch nichts gelernt');return;}
    modal(`<h3>Heutigen Fortschritt zurücksetzen?</h3><p class="muted">Alles, was du heute gelernt hast (Zeichen, Wörter, XP, Minuten und Sessions), wird auf den Stand von heute Morgen zurückgesetzt. Ältere Fortschritte bleiben erhalten.</p><div class="row2"><button class="ghost danger" data-act="dotreset">Ja</button><button class="primary" style="margin-top:8px" data-act="close">Nein</button></div>`);},
  dotreset:()=>{const s=S.snap;S.items=JSON.parse(JSON.stringify(s.items));S.xp=s.xp;S.stats=Object.assign({},s.stats);delete S.days[dk()];save();closeModal();render();toast('Heutiger Fortschritt zurückgesetzt ✓');},
  doreset:()=>{S=fresh();save();closeModal();render();toast('Zurückgesetzt');}
};
function checkBuild(){const ex=SESS.ex,it=ITEMS[ex.id];if(ex.result)return;const w=ex.picked.map(i=>ex.tiles[i]).join('');answer(w===it.kana);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;ensureAudio();const f=ACT[b.dataset.act];if(f)f(b,e);});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.form==='type'&&SESS&&SESS.ex&&!SESS.ex.result){const v=$('#typein').value.trim().toLowerCase();if(!v)return;const it=ITEMS[SESS.ex.id];const ok=[it.romaji,...(ALT[it.romaji]||[])].includes(v);answer(ok,{val:v});}});

render();
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.self===window.top){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
